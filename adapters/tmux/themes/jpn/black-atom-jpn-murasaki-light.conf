# Theme: Black Atom — JPN ∷ Murasaki Light
# Appearance: light
# Collection: JPN

# Status bar
set -g status-style fg=#915495,bg=#ffdeff
set -g status-left-style fg=#97a941,bg=#ffdeff
set -g status-right-style fg=#915495,bg=#ffdeff

# Window status
set-window-option -g window-status-style fg=#915495
set-window-option -g window-status-current-style fg=#97a941,bold
set-window-option -g window-status-activity-style fg=#007498,bold
set-window-option -g window-status-bell-style fg=#007498,bold

# Pane borders
set -g pane-border-style fg=#ca86cd
set -g pane-active-border-style fg=#97a941

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#915495
set -g window-active-style fg=#452a32

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#97a941]●,#[fg=#915495]○}"

# Session switcher & copy mode
set -g mode-style fg=#97a941,bg=#f2d1f2

# Messages & command prompt - minimal style
set -g message-style fg=#007498,bg=#ffdeff,bold
set -g message-command-style fg=#97a941,bg=#ffdeff

# Display panes
set -g display-panes-active-colour "#97a941"
set -g display-panes-colour "#915495"
