# Theme: Black Atom — JPN ∷ Murasaki Light
# Appearance: light
# Collection: JPN

# Status bar
set -g status-style fg=#865f88,bg=#f4e9f5
set -g status-left-style fg=#97a941,bg=#f4e9f5
set -g status-right-style fg=#865f88,bg=#f4e9f5

# Window status
set-window-option -g window-status-style fg=#865f88
set-window-option -g window-status-current-style fg=#97a941,bold
set-window-option -g window-status-activity-style fg=#4991a9,bold
set-window-option -g window-status-bell-style fg=#4991a9,bold

# Pane borders
set -g pane-border-style fg=#865f88
set -g pane-active-border-style fg=#97a941

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#865f88
set -g window-active-style fg=#452a32

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#97a941]●,#[fg=#865f88]○}"

# Session switcher & copy mode
set -g mode-style fg=#97a941,bg=#f9f0f9

# Messages & command prompt - minimal style
set -g message-style fg=#4991a9,bg=#f4e9f5,bold
set -g message-command-style fg=#97a941,bg=#f4e9f5

# Display panes
set -g display-panes-active-colour "#97a941"
set -g display-panes-colour "#865f88"
