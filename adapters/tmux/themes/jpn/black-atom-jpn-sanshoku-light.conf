# Theme: Black Atom — JPN ∷ Sanshoku Light
# Appearance: light
# Collection: JPN

# Status bar
set -g status-style fg=#768595,bg=#eaf1f8
set -g status-left-style fg=#c47600,bg=#eaf1f8
set -g status-right-style fg=#768595,bg=#eaf1f8

# Window status
set-window-option -g window-status-style fg=#768595
set-window-option -g window-status-current-style fg=#c47600,bold
set-window-option -g window-status-activity-style fg=#2d6ebd,bold
set-window-option -g window-status-bell-style fg=#2d6ebd,bold

# Pane borders
set -g pane-border-style fg=#768595
set -g pane-active-border-style fg=#c47600

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#768595
set -g window-active-style fg=#192f46

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#c47600]●,#[fg=#768595]○}"

# Session switcher & copy mode
set -g mode-style fg=#c47600,bg=#f3f7fc

# Messages & command prompt - minimal style
set -g message-style fg=#2d6ebd,bg=#eaf1f8,bold
set -g message-command-style fg=#c47600,bg=#eaf1f8

# Display panes
set -g display-panes-active-colour "#c47600"
set -g display-panes-colour "#768595"
