# Theme: Black Atom — JPN ∷ Sanshoku Light
# Appearance: light
# Collection: JPN

# Status bar
set -g status-style fg=#617683,bg=#c3cfd4
set -g status-left-style fg=#cc8f00,bg=#c3cfd4
set -g status-right-style fg=#617683,bg=#c3cfd4

# Window status
set-window-option -g window-status-style fg=#617683
set-window-option -g window-status-current-style fg=#cc8f00,bold
set-window-option -g window-status-activity-style fg=#457ea1,bold
set-window-option -g window-status-bell-style fg=#457ea1,bold

# Pane borders
set -g pane-border-style fg=#617683
set -g pane-active-border-style fg=#cc8f00

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#617683
set -g window-active-style fg=#0f212d

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#cc8f00]●,#[fg=#617683]○}"

# Session switcher & copy mode
set -g mode-style fg=#cc8f00,bg=#d2dbdf

# Messages & command prompt - minimal style
set -g message-style fg=#457ea1,bg=#c3cfd4,bold
set -g message-command-style fg=#cc8f00,bg=#c3cfd4

# Display panes
set -g display-panes-active-colour "#cc8f00"
set -g display-panes-colour "#617683"
