# Theme: Black Atom — TR-1000 ∷ Dark
# Appearance: dark
# Collection: TR-1000

# Status bar
set -g status-style fg=#9198a8,bg=#1c1d21
set -g status-left-style fg=#75c8fc,bg=#1c1d21
set -g status-right-style fg=#9198a8,bg=#1c1d21

# Window status
set-window-option -g window-status-style fg=#9198a8
set-window-option -g window-status-current-style fg=#75c8fc,bold
set-window-option -g window-status-activity-style fg=#63bfe1,bold
set-window-option -g window-status-bell-style fg=#63bfe1,bold

# Pane borders
set -g pane-border-style fg=#9198a8
set -g pane-active-border-style fg=#75c8fc

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#9198a8
set -g window-active-style fg=#dee1e8

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#75c8fc]●,#[fg=#9198a8]○}"

# Session switcher & copy mode
set -g mode-style fg=#75c8fc,bg=#27292d

# Messages & command prompt - minimal style
set -g message-style fg=#63bfe1,bg=#1c1d21,bold
set -g message-command-style fg=#75c8fc,bg=#1c1d21

# Display panes
set -g display-panes-active-colour "#75c8fc"
set -g display-panes-colour "#9198a8"
