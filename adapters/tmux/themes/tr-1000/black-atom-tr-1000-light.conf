# Theme: Black Atom — TR-1000 ∷ Light
# Appearance: light
# Collection: TR-1000

# Status bar
set -g status-style fg=#626978,bg=#d4d7e0
set -g status-left-style fg=#5570ac,bg=#d4d7e0
set -g status-right-style fg=#626978,bg=#d4d7e0

# Window status
set-window-option -g window-status-style fg=#626978
set-window-option -g window-status-current-style fg=#5570ac,bold
set-window-option -g window-status-activity-style fg=#005c83,bold
set-window-option -g window-status-bell-style fg=#005c83,bold

# Pane borders
set -g pane-border-style fg=#8b92a2
set -g pane-active-border-style fg=#5570ac

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#626978
set -g window-active-style fg=#202126

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#5570ac]●,#[fg=#626978]○}"

# Session switcher & copy mode
set -g mode-style fg=#5570ac,bg=#babec6

# Messages & command prompt - minimal style
set -g message-style fg=#005c83,bg=#d4d7e0,bold
set -g message-command-style fg=#5570ac,bg=#d4d7e0

# Display panes
set -g display-panes-active-colour "#5570ac"
set -g display-panes-colour "#626978"
