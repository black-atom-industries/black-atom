# Theme: Black Atom — Dimmed Light
# Appearance: light
# Collection: Default

# Status bar
set -g status-style fg=#43484e,bg=#dfe5ec
set -g status-left-style fg=#19b168,bg=#dfe5ec
set -g status-right-style fg=#43484e,bg=#dfe5ec

# Window status
set-window-option -g window-status-style fg=#43484e
set-window-option -g window-status-current-style fg=#19b168,bold
set-window-option -g window-status-activity-style fg=#1c989e,bold
set-window-option -g window-status-bell-style fg=#1c989e,bold

# Pane borders
set -g pane-border-style fg=#43484e
set -g pane-active-border-style fg=#19b168

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#43484e
set -g window-active-style fg=#0e1217

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#19b168]●,#[fg=#43484e]○}"

# Session switcher & copy mode
set -g mode-style fg=#19b168,bg=#ecf3fa

# Messages & command prompt - minimal style
set -g message-style fg=#1c989e,bg=#dfe5ec,bold
set -g message-command-style fg=#19b168,bg=#dfe5ec

# Display panes
set -g display-panes-active-colour "#19b168"
set -g display-panes-colour "#43484e"
