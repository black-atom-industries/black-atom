# Theme: Black Atom — Minium ∷ Polymer Light
# Appearance: light
# Collection: Minium

# Status bar
set -g status-style fg=#4b4745,bg=#dfdad2
set -g status-left-style fg=#fd4200,bg=#dfdad2
set -g status-right-style fg=#4b4745,bg=#dfdad2

# Window status
set-window-option -g window-status-style fg=#4b4745
set-window-option -g window-status-current-style fg=#fd4200,bold
set-window-option -g window-status-activity-style fg=#00a3e9,bold
set-window-option -g window-status-bell-style fg=#00a3e9,bold

# Pane borders
set -g pane-border-style fg=#4b4745
set -g pane-active-border-style fg=#fd4200

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#4b4745
set -g window-active-style fg=#1d1d1d

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#fd4200]●,#[fg=#4b4745]○}"

# Session switcher & copy mode
set -g mode-style fg=#fd4200,bg=#f1eae0

# Messages & command prompt - minimal style
set -g message-style fg=#00a3e9,bg=#dfdad2,bold
set -g message-command-style fg=#fd4200,bg=#dfdad2

# Display panes
set -g display-panes-active-colour "#fd4200"
set -g display-panes-colour "#4b4745"
