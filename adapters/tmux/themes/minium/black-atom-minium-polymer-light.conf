# Theme: Black Atom — Minium ∷ Polymer Light
# Appearance: light
# Collection: Minium

# Status bar
set -g status-style fg=#46474c,bg=#dbdbdb
set -g status-left-style fg=#f55d12,bg=#dbdbdb
set -g status-right-style fg=#46474c,bg=#dbdbdb

# Window status
set-window-option -g window-status-style fg=#46474c
set-window-option -g window-status-current-style fg=#f55d12,bold
set-window-option -g window-status-activity-style fg=#00a3e9,bold
set-window-option -g window-status-bell-style fg=#00a3e9,bold

# Pane borders
set -g pane-border-style fg=#46474c
set -g pane-active-border-style fg=#f55d12

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#46474c
set -g window-active-style fg=#1d1d1d

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#f55d12]●,#[fg=#46474c]○}"

# Session switcher & copy mode
set -g mode-style fg=#f55d12,bg=#ebebeb

# Messages & command prompt - minimal style
set -g message-style fg=#00a3e9,bg=#dbdbdb,bold
set -g message-command-style fg=#f55d12,bg=#dbdbdb

# Display panes
set -g display-panes-active-colour "#f55d12"
set -g display-panes-colour "#46474c"
