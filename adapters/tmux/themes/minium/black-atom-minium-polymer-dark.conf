# Theme: Black Atom — Minium ∷ Polymer Dark
# Appearance: dark
# Collection: Minium

# Status bar
set -g status-style fg=#757b80,bg=#252728
set -g status-left-style fg=#ff8352,bg=#252728
set -g status-right-style fg=#757b80,bg=#252728

# Window status
set-window-option -g window-status-style fg=#757b80
set-window-option -g window-status-current-style fg=#ff8352,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#757b80
set -g pane-active-border-style fg=#ff8352

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#757b80
set -g window-active-style fg=#cfcdcb

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ff8352]●,#[fg=#757b80]○}"

# Session switcher & copy mode
set -g mode-style fg=#ff8352,bg=#27292a

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#252728,bold
set -g message-command-style fg=#ff8352,bg=#252728

# Display panes
set -g display-panes-active-colour "#ff8352"
set -g display-panes-colour "#757b80"
