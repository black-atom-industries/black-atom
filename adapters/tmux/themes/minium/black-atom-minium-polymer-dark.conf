# Theme: Black Atom — Minium ∷ Polymer Dark
# Appearance: dark
# Collection: Minium

# Status bar
set -g status-style fg=#7e7974,bg=#1d252d
set -g status-left-style fg=#ff8b37,bg=#1d252d
set -g status-right-style fg=#7e7974,bg=#1d252d

# Window status
set-window-option -g window-status-style fg=#7e7974
set-window-option -g window-status-current-style fg=#ff8b37,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#7e7974
set -g pane-active-border-style fg=#ff8b37

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#7e7974
set -g window-active-style fg=#d9ccba

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ff8b37]●,#[fg=#7e7974]○}"

# Session switcher & copy mode
set -g mode-style fg=#ff8b37,bg=#29313a

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#1d252d,bold
set -g message-command-style fg=#ff8b37,bg=#1d252d

# Display panes
set -g display-panes-active-colour "#ff8b37"
set -g display-panes-colour "#7e7974"
