# Theme: Black Atom — Minium ∷ Viridian Dark
# Appearance: dark
# Collection: Minium

# Status bar
set -g status-style fg=#67b5a9,bg=#13403a
set -g status-left-style fg=#e69173,bg=#13403a
set -g status-right-style fg=#67b5a9,bg=#13403a

# Window status
set-window-option -g window-status-style fg=#67b5a9
set-window-option -g window-status-current-style fg=#e69173,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#67b5a9
set -g pane-active-border-style fg=#e69173

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#67b5a9
set -g window-active-style fg=#daf1ed

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#e69173]●,#[fg=#67b5a9]○}"

# Session switcher & copy mode
set -g mode-style fg=#e69173,bg=#194c45

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#13403a,bold
set -g message-command-style fg=#e69173,bg=#13403a

# Display panes
set -g display-panes-active-colour "#e69173"
set -g display-panes-colour "#67b5a9"
