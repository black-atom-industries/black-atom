# Theme: Black Atom — Minium ∷ Sienna Light
# Appearance: light
# Collection: Minium

# Status bar
set -g status-style fg=#676261,bg=#ece3da
set -g status-left-style fg=#ff7b26,bg=#ece3da
set -g status-right-style fg=#676261,bg=#ece3da

# Window status
set-window-option -g window-status-style fg=#676261
set-window-option -g window-status-current-style fg=#ff7b26,bold
set-window-option -g window-status-activity-style fg=#00a3e9,bold
set-window-option -g window-status-bell-style fg=#00a3e9,bold

# Pane borders
set -g pane-border-style fg=#676261
set -g pane-active-border-style fg=#ff7b26

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#676261
set -g window-active-style fg=#3d393a

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ff7b26]●,#[fg=#676261]○}"

# Session switcher & copy mode
set -g mode-style fg=#ff7b26,bg=#f9f0e8

# Messages & command prompt - minimal style
set -g message-style fg=#00a3e9,bg=#ece3da,bold
set -g message-command-style fg=#ff7b26,bg=#ece3da

# Display panes
set -g display-panes-active-colour "#ff7b26"
set -g display-panes-colour "#676261"
