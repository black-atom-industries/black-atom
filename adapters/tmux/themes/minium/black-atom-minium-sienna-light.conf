# Theme: Black Atom — Minium ∷ Sienna Light
# Appearance: light
# Collection: Minium

# Status bar
set -g status-style fg=#666261,bg=#efe3d3
set -g status-left-style fg=#ff2e00,bg=#efe3d3
set -g status-right-style fg=#666261,bg=#efe3d3

# Window status
set-window-option -g window-status-style fg=#666261
set-window-option -g window-status-current-style fg=#ff2e00,bold
set-window-option -g window-status-activity-style fg=#00a3e9,bold
set-window-option -g window-status-bell-style fg=#00a3e9,bold

# Pane borders
set -g pane-border-style fg=#666261
set -g pane-active-border-style fg=#ff2e00

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#666261
set -g window-active-style fg=#3d393a

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ff2e00]●,#[fg=#666261]○}"

# Session switcher & copy mode
set -g mode-style fg=#ff2e00,bg=#fbf0e0

# Messages & command prompt - minimal style
set -g message-style fg=#00a3e9,bg=#efe3d3,bold
set -g message-command-style fg=#ff2e00,bg=#efe3d3

# Display panes
set -g display-panes-active-colour "#ff2e00"
set -g display-panes-colour "#666261"
