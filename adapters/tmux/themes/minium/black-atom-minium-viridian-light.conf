# Theme: Black Atom — Minium ∷ Viridian Light
# Appearance: light
# Collection: Minium

# Status bar
set -g status-style fg=#308176,bg=#daf1ed
set -g status-left-style fg=#ee560c,bg=#daf1ed
set -g status-right-style fg=#308176,bg=#daf1ed

# Window status
set-window-option -g window-status-style fg=#308176
set-window-option -g window-status-current-style fg=#ee560c,bold
set-window-option -g window-status-activity-style fg=#0073c7,bold
set-window-option -g window-status-bell-style fg=#0073c7,bold

# Pane borders
set -g pane-border-style fg=#308176
set -g pane-active-border-style fg=#ee560c

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#308176
set -g window-active-style fg=#13403a

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ee560c]●,#[fg=#308176]○}"

# Session switcher & copy mode
set -g mode-style fg=#ee560c,bg=#f0fbf9

# Messages & command prompt - minimal style
set -g message-style fg=#0073c7,bg=#daf1ed,bold
set -g message-command-style fg=#ee560c,bg=#daf1ed

# Display panes
set -g display-panes-active-colour "#ee560c"
set -g display-panes-colour "#308176"
