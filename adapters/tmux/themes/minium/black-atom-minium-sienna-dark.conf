# Theme: Black Atom — Minium ∷ Sienna Dark
# Appearance: dark
# Collection: Minium

# Status bar
set -g status-style fg=#7e7974,bg=#2b2827
set -g status-left-style fg=#ec785b,bg=#2b2827
set -g status-right-style fg=#7e7974,bg=#2b2827

# Window status
set-window-option -g window-status-style fg=#7e7974
set-window-option -g window-status-current-style fg=#ec785b,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#7e7974
set -g pane-active-border-style fg=#ec785b

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#7e7974
set -g window-active-style fg=#d9ccba

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ec785b]●,#[fg=#7e7974]○}"

# Session switcher & copy mode
set -g mode-style fg=#ec785b,bg=#383434

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#2b2827,bold
set -g message-command-style fg=#ec785b,bg=#2b2827

# Display panes
set -g display-panes-active-colour "#ec785b"
set -g display-panes-colour "#7e7974"
