# Theme: Black Atom — Minium ∷ Sienna Dark
# Appearance: dark
# Collection: Minium

# Status bar
set -g status-style fg=#857f7a,bg=#2e2726
set -g status-left-style fg=#ef9369,bg=#2e2726
set -g status-right-style fg=#857f7a,bg=#2e2726

# Window status
set-window-option -g window-status-style fg=#857f7a
set-window-option -g window-status-current-style fg=#ef9369,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#857f7a
set -g pane-active-border-style fg=#ef9369

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#857f7a
set -g window-active-style fg=#d9ccba

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ef9369]●,#[fg=#857f7a]○}"

# Session switcher & copy mode
set -g mode-style fg=#ef9369,bg=#3a3333

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#2e2726,bold
set -g message-command-style fg=#ef9369,bg=#2e2726

# Display panes
set -g display-panes-active-colour "#ef9369"
set -g display-panes-colour "#857f7a"
