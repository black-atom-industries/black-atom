# Theme: Black Atom — TERRA ∷ Fall Dark
# Appearance: dark
# Collection: Terra

# Status bar
set -g status-style fg=#c59174,bg=#241711
set -g status-left-style fg=#ce903a,bg=#241711
set -g status-right-style fg=#c59174,bg=#241711

# Window status
set-window-option -g window-status-style fg=#c59174
set-window-option -g window-status-current-style fg=#ce903a,bold
set-window-option -g window-status-activity-style fg=#e2baa5,bold
set-window-option -g window-status-bell-style fg=#e2baa5,bold

# Pane borders
set -g pane-border-style fg=#86563b
set -g pane-active-border-style fg=#ce903a

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#c59174
set -g window-active-style fg=#eac5b1

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ce903a]●,#[fg=#c59174]○}"

# Session switcher & copy mode
set -g mode-style fg=#ce903a,bg=#2e201a

# Messages & command prompt - minimal style
set -g message-style fg=#e2baa5,bg=#241711,bold
set -g message-command-style fg=#ce903a,bg=#241711

# Display panes
set -g display-panes-active-colour "#ce903a"
set -g display-panes-colour "#c59174"
