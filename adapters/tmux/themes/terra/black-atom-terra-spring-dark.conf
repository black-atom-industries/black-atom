# Theme: Black Atom — TERRA ∷ Spring Dark
# Appearance: dark
# Collection: Terra

# Status bar
set -g status-style fg=#8ab091,bg=#0a2316
set -g status-left-style fg=#d5e43f,bg=#0a2316
set -g status-right-style fg=#8ab091,bg=#0a2316

# Window status
set-window-option -g window-status-style fg=#8ab091
set-window-option -g window-status-current-style fg=#d5e43f,bold
set-window-option -g window-status-activity-style fg=#70afe3,bold
set-window-option -g window-status-bell-style fg=#70afe3,bold

# Pane borders
set -g pane-border-style fg=#8ab091
set -g pane-active-border-style fg=#d5e43f

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#8ab091
set -g window-active-style fg=#c8d7bb

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#d5e43f]●,#[fg=#8ab091]○}"

# Session switcher & copy mode
set -g mode-style fg=#d5e43f,bg=#133020

# Messages & command prompt - minimal style
set -g message-style fg=#70afe3,bg=#0a2316,bold
set -g message-command-style fg=#d5e43f,bg=#0a2316

# Display panes
set -g display-panes-active-colour "#d5e43f"
set -g display-panes-colour "#8ab091"
