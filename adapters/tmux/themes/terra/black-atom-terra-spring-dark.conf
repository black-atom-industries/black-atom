# Theme: Black Atom — TERRA ∷ Spring Dark
# Appearance: dark
# Collection: Terra

# Status bar
set -g status-style fg=#8ab091,bg=#112118
set -g status-left-style fg=#a4dd98,bg=#112118
set -g status-right-style fg=#8ab091,bg=#112118

# Window status
set-window-option -g window-status-style fg=#8ab091
set-window-option -g window-status-current-style fg=#a4dd98,bold
set-window-option -g window-status-activity-style fg=#98c4e4,bold
set-window-option -g window-status-bell-style fg=#98c4e4,bold

# Pane borders
set -g pane-border-style fg=#2d5137
set -g pane-active-border-style fg=#a4dd98

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#8ab091
set -g window-active-style fg=#c8d7bb

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#a4dd98]●,#[fg=#8ab091]○}"

# Session switcher & copy mode
set -g mode-style fg=#a4dd98,bg=#1c2d23

# Messages & command prompt - minimal style
set -g message-style fg=#98c4e4,bg=#112118,bold
set -g message-command-style fg=#a4dd98,bg=#112118

# Display panes
set -g display-panes-active-colour "#a4dd98"
set -g display-panes-colour "#8ab091"
