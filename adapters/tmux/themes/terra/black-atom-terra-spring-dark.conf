# Theme: Black Atom — TERRA ∷ Spring Dark
# Appearance: dark
# Collection: Terra

# Status bar
set -g status-style fg=#be97b2,bg=#1c1e14
set -g status-left-style fg=#fb988f,bg=#1c1e14
set -g status-right-style fg=#be97b2,bg=#1c1e14

# Window status
set-window-option -g window-status-style fg=#be97b2
set-window-option -g window-status-current-style fg=#fb988f,bold
set-window-option -g window-status-activity-style fg=#a6beef,bold
set-window-option -g window-status-bell-style fg=#a6beef,bold

# Pane borders
set -g pane-border-style fg=#464a3b
set -g pane-active-border-style fg=#fb988f

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#be97b2
set -g window-active-style fg=#dccfbc

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#fb988f]●,#[fg=#be97b2]○}"

# Session switcher & copy mode
set -g mode-style fg=#fb988f,bg=#272b1e

# Messages & command prompt - minimal style
set -g message-style fg=#a6beef,bg=#1c1e14,bold
set -g message-command-style fg=#fb988f,bg=#1c1e14

# Display panes
set -g display-panes-active-colour "#fb988f"
set -g display-panes-colour "#be97b2"
