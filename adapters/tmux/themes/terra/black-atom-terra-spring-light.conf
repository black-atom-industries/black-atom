# Theme: Black Atom — TERRA ∷ Spring Light
# Appearance: light
# Collection: Terra

# Status bar
set -g status-style fg=#3c744a,bg=#eef5e3
set -g status-left-style fg=#cede1c,bg=#eef5e3
set -g status-right-style fg=#3c744a,bg=#eef5e3

# Window status
set-window-option -g window-status-style fg=#3c744a
set-window-option -g window-status-current-style fg=#cede1c,bold
set-window-option -g window-status-activity-style fg=#3574a4,bold
set-window-option -g window-status-bell-style fg=#3574a4,bold

# Pane borders
set -g pane-border-style fg=#3c744a
set -g pane-active-border-style fg=#cede1c

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#3c744a
set -g window-active-style fg=#275639

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#cede1c]●,#[fg=#3c744a]○}"

# Session switcher & copy mode
set -g mode-style fg=#cede1c,bg=#d4e4cd

# Messages & command prompt - minimal style
set -g message-style fg=#3574a4,bg=#eef5e3,bold
set -g message-command-style fg=#cede1c,bg=#eef5e3

# Display panes
set -g display-panes-active-colour "#cede1c"
set -g display-panes-colour "#3c744a"
