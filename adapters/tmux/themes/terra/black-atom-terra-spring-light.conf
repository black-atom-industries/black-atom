# Theme: Black Atom — TERRA ∷ Spring Light
# Appearance: light
# Collection: Terra

# Status bar
set -g status-style fg=#626a4d,bg=#faf1e2
set -g status-left-style fg=#e66f66,bg=#faf1e2
set -g status-right-style fg=#626a4d,bg=#faf1e2

# Window status
set-window-option -g window-status-style fg=#626a4d
set-window-option -g window-status-current-style fg=#e66f66,bold
set-window-option -g window-status-activity-style fg=#4964a3,bold
set-window-option -g window-status-bell-style fg=#4964a3,bold

# Pane borders
set -g pane-border-style fg=#aeb2a4
set -g pane-active-border-style fg=#e66f66

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#626a4d
set -g window-active-style fg=#474e35

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#e66f66]●,#[fg=#626a4d]○}"

# Session switcher & copy mode
set -g mode-style fg=#e66f66,bg=#eadcc5

# Messages & command prompt - minimal style
set -g message-style fg=#4964a3,bg=#faf1e2,bold
set -g message-command-style fg=#e66f66,bg=#faf1e2

# Display panes
set -g display-panes-active-colour "#e66f66"
set -g display-panes-colour "#626a4d"
