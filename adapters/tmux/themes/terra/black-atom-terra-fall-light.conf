# Theme: Black Atom — TERRA ∷ Fall Light
# Appearance: light
# Collection: Terra

# Status bar
set -g status-style fg=#815136,bg=#ffddbb
set -g status-left-style fg=#c96600,bg=#ffddbb
set -g status-right-style fg=#815136,bg=#ffddbb

# Window status
set-window-option -g window-status-style fg=#815136
set-window-option -g window-status-current-style fg=#c96600,bold
set-window-option -g window-status-activity-style fg=#8c583b,bold
set-window-option -g window-status-bell-style fg=#8c583b,bold

# Pane borders
set -g pane-border-style fg=#815136
set -g pane-active-border-style fg=#c96600

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#815136
set -g window-active-style fg=#422616

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#c96600]●,#[fg=#815136]○}"

# Session switcher & copy mode
set -g mode-style fg=#c96600,bg=#eec5a3

# Messages & command prompt - minimal style
set -g message-style fg=#8c583b,bg=#ffddbb,bold
set -g message-command-style fg=#c96600,bg=#ffddbb

# Display panes
set -g display-panes-active-colour "#c96600"
set -g display-panes-colour "#815136"
