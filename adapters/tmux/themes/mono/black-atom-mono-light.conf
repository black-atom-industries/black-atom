# Theme: Black Atom — Mono ∷ Light
# Appearance: light
# Collection: Mono

# Status bar
set -g status-style fg=#605d5b,bg=#fefbf8
set -g status-left-style fg=#2e2e2e,bg=#fefbf8
set -g status-right-style fg=#605d5b,bg=#fefbf8

# Window status
set-window-option -g window-status-style fg=#605d5b
set-window-option -g window-status-current-style fg=#2e2e2e,bold
set-window-option -g window-status-activity-style fg=#0079bd,bold
set-window-option -g window-status-bell-style fg=#0079bd,bold

# Pane borders
set -g pane-border-style fg=#605d5b
set -g pane-active-border-style fg=#2e2e2e

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#605d5b
set -g window-active-style fg=#181614

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#2e2e2e]●,#[fg=#605d5b]○}"

# Session switcher & copy mode
set -g mode-style fg=#2e2e2e,bg=#fffffc

# Messages & command prompt - minimal style
set -g message-style fg=#0079bd,bg=#fefbf8,bold
set -g message-command-style fg=#2e2e2e,bg=#fefbf8

# Display panes
set -g display-panes-active-colour "#2e2e2e"
set -g display-panes-colour "#605d5b"
