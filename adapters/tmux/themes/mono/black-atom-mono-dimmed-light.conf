# Theme: Black Atom — Mono ∷ Dimmed Light
# Appearance: light
# Collection: Mono

# Status bar
set -g status-style fg=#525252,bg=#dedede
set -g status-left-style fg=#5f5155,bg=#dedede
set -g status-right-style fg=#525252,bg=#dedede

# Window status
set-window-option -g window-status-style fg=#525252
set-window-option -g window-status-current-style fg=#5f5155,bold
set-window-option -g window-status-activity-style fg=#0079bd,bold
set-window-option -g window-status-bell-style fg=#0079bd,bold

# Pane borders
set -g pane-border-style fg=#525252
set -g pane-active-border-style fg=#5f5155

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#525252
set -g window-active-style fg=#292929

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#5f5155]●,#[fg=#525252]○}"

# Session switcher & copy mode
set -g mode-style fg=#5f5155,bg=#ebebeb

# Messages & command prompt - minimal style
set -g message-style fg=#0079bd,bg=#dedede,bold
set -g message-command-style fg=#5f5155,bg=#dedede

# Display panes
set -g display-panes-active-colour "#5f5155"
set -g display-panes-colour "#525252"
