# Theme: Black Atom — PAPER ∷ Blue Dark
# Appearance: dark
# Collection: MNML (Minimal)

# Status bar
set -g status-style fg=#8098ca,bg=#152650
set -g status-left-style fg=#fa8f19,bg=#152650
set -g status-right-style fg=#8098ca,bg=#152650

# Window status
set-window-option -g window-status-style fg=#8098ca
set-window-option -g window-status-current-style fg=#fa8f19,bold
set-window-option -g window-status-activity-style fg=#79b5cc,bold
set-window-option -g window-status-bell-style fg=#79b5cc,bold

# Pane borders
set -g pane-border-style fg=#8098ca
set -g pane-active-border-style fg=#fa8f19

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#8098ca
set -g window-active-style fg=#ebf2ff

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#fa8f19]●,#[fg=#8098ca]○}"

# Session switcher & copy mode
set -g mode-style fg=#fa8f19,bg=#1e305b

# Messages & command prompt - minimal style
set -g message-style fg=#79b5cc,bg=#152650,bold
set -g message-command-style fg=#fa8f19,bg=#152650

# Display panes
set -g display-panes-active-colour "#fa8f19"
set -g display-panes-colour "#8098ca"
