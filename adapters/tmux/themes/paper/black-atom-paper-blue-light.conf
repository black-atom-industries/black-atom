# Theme: Black Atom — PAPER ∷ Blue Light
# Appearance: light
# Collection: MNML (Minimal)

# Status bar
set -g status-style fg=#2955d3,bg=#f2f5fc
set -g status-left-style fg=#275bff,bg=#f2f5fc
set -g status-right-style fg=#2955d3,bg=#f2f5fc

# Window status
set-window-option -g window-status-style fg=#2955d3
set-window-option -g window-status-current-style fg=#275bff,bold
set-window-option -g window-status-activity-style fg=#00a3e9,bold
set-window-option -g window-status-bell-style fg=#00a3e9,bold

# Pane borders
set -g pane-border-style fg=#2955d3
set -g pane-active-border-style fg=#275bff

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#2955d3
set -g window-active-style fg=#040089

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#275bff]●,#[fg=#2955d3]○}"

# Session switcher & copy mode
set -g mode-style fg=#275bff,bg=#f8fcff

# Messages & command prompt - minimal style
set -g message-style fg=#00a3e9,bg=#f2f5fc,bold
set -g message-command-style fg=#275bff,bg=#f2f5fc

# Display panes
set -g display-panes-active-colour "#275bff"
set -g display-panes-colour "#2955d3"
