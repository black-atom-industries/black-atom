# Theme: Black Atom — Facility ∷ Dark
# Appearance: dark
# Collection: Facility

# Status bar
set -g status-style fg=#a7b4b6,bg=#0d1012
set -g status-left-style fg=#ddfa5f,bg=#0d1012
set -g status-right-style fg=#a7b4b6,bg=#0d1012

# Window status
set-window-option -g window-status-style fg=#a7b4b6
set-window-option -g window-status-current-style fg=#ddfa5f,bold
set-window-option -g window-status-activity-style fg=#dae4e7,bold
set-window-option -g window-status-bell-style fg=#dae4e7,bold

# Pane borders
set -g pane-border-style fg=#a7b4b6
set -g pane-active-border-style fg=#ddfa5f

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#a7b4b6
set -g window-active-style fg=#e3edf0

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ddfa5f]●,#[fg=#a7b4b6]○}"

# Session switcher & copy mode
set -g mode-style fg=#ddfa5f,bg=#1a1e20

# Messages & command prompt - minimal style
set -g message-style fg=#dae4e7,bg=#0d1012,bold
set -g message-command-style fg=#ddfa5f,bg=#0d1012

# Display panes
set -g display-panes-active-colour "#ddfa5f"
set -g display-panes-colour "#a7b4b6"
