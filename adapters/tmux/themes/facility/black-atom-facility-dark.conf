# Theme: Black Atom — Facility ∷ Dark
# Appearance: dark
# Collection: Facility

# Status bar
set -g status-style fg=#91bcad,bg=#0c1010
set -g status-left-style fg=#e2f776,bg=#0c1010
set -g status-right-style fg=#91bcad,bg=#0c1010

# Window status
set-window-option -g window-status-style fg=#91bcad
set-window-option -g window-status-current-style fg=#e2f776,bold
set-window-option -g window-status-activity-style fg=#c3eed9,bold
set-window-option -g window-status-bell-style fg=#c3eed9,bold

# Pane borders
set -g pane-border-style fg=#91bcad
set -g pane-active-border-style fg=#e2f776

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#91bcad
set -g window-active-style fg=#d5f4e3

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#e2f776]●,#[fg=#91bcad]○}"

# Session switcher & copy mode
set -g mode-style fg=#e2f776,bg=#191e1e

# Messages & command prompt - minimal style
set -g message-style fg=#c3eed9,bg=#0c1010,bold
set -g message-command-style fg=#e2f776,bg=#0c1010

# Display panes
set -g display-panes-active-colour "#e2f776"
set -g display-panes-colour "#91bcad"
