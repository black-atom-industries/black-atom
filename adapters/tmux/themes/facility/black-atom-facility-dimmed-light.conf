# Theme: Black Atom — Facility ∷ Dimmed Light
# Appearance: light
# Collection: Facility

# Status bar
set -g status-style fg=#4b5b5d,bg=#e8f0f2
set -g status-left-style fg=#b2cd0d,bg=#e8f0f2
set -g status-right-style fg=#4b5b5d,bg=#e8f0f2

# Window status
set-window-option -g window-status-style fg=#4b5b5d
set-window-option -g window-status-current-style fg=#b2cd0d,bold
set-window-option -g window-status-activity-style fg=#475253,bold
set-window-option -g window-status-bell-style fg=#475253,bold

# Pane borders
set -g pane-border-style fg=#4b5b5d
set -g pane-active-border-style fg=#b2cd0d

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#4b5b5d
set -g window-active-style fg=#222426

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#b2cd0d]●,#[fg=#4b5b5d]○}"

# Session switcher & copy mode
set -g mode-style fg=#b2cd0d,bg=#d0d9dc

# Messages & command prompt - minimal style
set -g message-style fg=#475253,bg=#e8f0f2,bold
set -g message-command-style fg=#b2cd0d,bg=#e8f0f2

# Display panes
set -g display-panes-active-colour "#b2cd0d"
set -g display-panes-colour "#4b5b5d"
