# Theme: Black Atom — Facility ∷ Dimmed Light
# Appearance: light
# Collection: Facility

# Status bar
set -g status-style fg=#669a84,bg=#eaf0f0
set -g status-left-style fg=#a8ba33,bg=#eaf0f0
set -g status-right-style fg=#669a84,bg=#eaf0f0

# Window status
set-window-option -g window-status-style fg=#669a84
set-window-option -g window-status-current-style fg=#a8ba33,bold
set-window-option -g window-status-activity-style fg=#476a5f,bold
set-window-option -g window-status-bell-style fg=#476a5f,bold

# Pane borders
set -g pane-border-style fg=#669a84
set -g pane-active-border-style fg=#a8ba33

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#669a84
set -g window-active-style fg=#2b3b33

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#a8ba33]●,#[fg=#669a84]○}"

# Session switcher & copy mode
set -g mode-style fg=#a8ba33,bg=#d2d9d9

# Messages & command prompt - minimal style
set -g message-style fg=#476a5f,bg=#eaf0f0,bold
set -g message-command-style fg=#a8ba33,bg=#eaf0f0

# Display panes
set -g display-panes-active-colour "#a8ba33"
set -g display-panes-colour "#669a84"
