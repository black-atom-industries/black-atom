# Theme: Black Atom — Facility ∷ Light
# Appearance: light
# Collection: Facility

# Status bar
set -g status-style fg=#8e9b9c,bg=#f2fafd
set -g status-left-style fg=#b2cd0d,bg=#f2fafd
set -g status-right-style fg=#8e9b9c,bg=#f2fafd

# Window status
set-window-option -g window-status-style fg=#8e9b9c
set-window-option -g window-status-current-style fg=#b2cd0d,bold
set-window-option -g window-status-activity-style fg=#687273,bold
set-window-option -g window-status-bell-style fg=#687273,bold

# Pane borders
set -g pane-border-style fg=#8e9b9c
set -g pane-active-border-style fg=#b2cd0d

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#8e9b9c
set -g window-active-style fg=#2e3133

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#b2cd0d]●,#[fg=#8e9b9c]○}"

# Session switcher & copy mode
set -g mode-style fg=#b2cd0d,bg=#dfe9eb

# Messages & command prompt - minimal style
set -g message-style fg=#687273,bg=#f2fafd,bold
set -g message-command-style fg=#b2cd0d,bg=#f2fafd

# Display panes
set -g display-panes-active-colour "#b2cd0d"
set -g display-panes-colour "#8e9b9c"
