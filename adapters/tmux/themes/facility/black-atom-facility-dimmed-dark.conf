# Theme: Black Atom — Facility ∷ Dimmed Dark
# Appearance: dark
# Collection: Facility

# Status bar
set -g status-style fg=#91bcad,bg=#1c2020
set -g status-left-style fg=#dbee7a,bg=#1c2020
set -g status-right-style fg=#91bcad,bg=#1c2020

# Window status
set-window-option -g window-status-style fg=#91bcad
set-window-option -g window-status-current-style fg=#dbee7a,bold
set-window-option -g window-status-activity-style fg=#abe7ca,bold
set-window-option -g window-status-bell-style fg=#abe7ca,bold

# Pane borders
set -g pane-border-style fg=#91bcad
set -g pane-active-border-style fg=#dbee7a

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#91bcad
set -g window-active-style fg=#c1efd5

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#dbee7a]●,#[fg=#91bcad]○}"

# Session switcher & copy mode
set -g mode-style fg=#dbee7a,bg=#242a2a

# Messages & command prompt - minimal style
set -g message-style fg=#abe7ca,bg=#1c2020,bold
set -g message-command-style fg=#dbee7a,bg=#1c2020

# Display panes
set -g display-panes-active-colour "#dbee7a"
set -g display-panes-colour "#91bcad"
