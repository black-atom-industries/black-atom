# Theme: Black Atom — Facility ∷ Dimmed Dark
# Appearance: dark
# Collection: Facility

# Status bar
set -g status-style fg=#a7b4b6,bg=#1c2022
set -g status-left-style fg=#ddfa5f,bg=#1c2022
set -g status-right-style fg=#a7b4b6,bg=#1c2022

# Window status
set-window-option -g window-status-style fg=#a7b4b6
set-window-option -g window-status-current-style fg=#ddfa5f,bold
set-window-option -g window-status-activity-style fg=#cfd9dc,bold
set-window-option -g window-status-bell-style fg=#cfd9dc,bold

# Pane borders
set -g pane-border-style fg=#a7b4b6
set -g pane-active-border-style fg=#ddfa5f

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#a7b4b6
set -g window-active-style fg=#dae4e7

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#ddfa5f]●,#[fg=#a7b4b6]○}"

# Session switcher & copy mode
set -g mode-style fg=#ddfa5f,bg=#252a2c

# Messages & command prompt - minimal style
set -g message-style fg=#cfd9dc,bg=#1c2022,bold
set -g message-command-style fg=#ddfa5f,bg=#1c2022

# Display panes
set -g display-panes-active-colour "#ddfa5f"
set -g display-panes-colour "#a7b4b6"
