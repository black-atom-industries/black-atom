# Theme: Black Atom — AGAR ∷ Light
# Appearance: light
# Collection: AGAR

# Status bar
set -g status-style fg=#929082,bg=#e9e7d8
set -g status-left-style fg=#11ad32,bg=#e9e7d8
set -g status-right-style fg=#929082,bg=#e9e7d8

# Window status
set-window-option -g window-status-style fg=#929082
set-window-option -g window-status-current-style fg=#11ad32,bold
set-window-option -g window-status-activity-style fg=#505fe4,bold
set-window-option -g window-status-bell-style fg=#505fe4,bold

# Pane borders
set -g pane-border-style fg=#b1aea0
set -g pane-active-border-style fg=#11ad32

# Pane foreground (inactive panes dimmed)
set -g window-style fg=#929082
set -g window-active-style fg=#2a281b

# Pane status bar
set -g pane-border-format "#{?pane_active,#[fg=#11ad32]●,#[fg=#929082]○}"

# Session switcher & copy mode
set -g mode-style fg=#11ad32,bg=#c8c6b8

# Messages & command prompt - minimal style
set -g message-style fg=#505fe4,bg=#e9e7d8,bold
set -g message-command-style fg=#11ad32,bg=#e9e7d8

# Display panes
set -g display-panes-active-colour "#11ad32"
set -g display-panes-colour "#929082"
