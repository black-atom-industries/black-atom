# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — PAPER ∷ Brown Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#242424"
panel_bg = "#e8d8c4"
sidebar_bg = "#e8d8c4"
active_row_bg = "#f2e2ce"
selection_bg = "#decfba"
surface_dim = "#f2e2ce"
surface0 = "##fdf0de"
surface1 = "##f2e2ce"
overlay0 = "#7a7062"
overlay1 = "#242424"
text = "#2b2826"
subtext0 = "#7a7062"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#c4b5a1"
mauve = "#aa9c8a"
peach = "#aa9c8a"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#242424" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#242424" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
