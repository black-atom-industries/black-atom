[theme.custom]
accent = "#242424"
panel_bg = "#e8d8c4"
surface_dim = "#e8d8c4"
surface0 = "#fdf0de"
surface1 = "#fdf0de"
overlay0 = "#7a7062"
overlay1 = "#aa9c8a"
text = "#2b2826"
subtext0 = "#7a7062"
red = "#c4b5a1"
green = "#aa9c8a"
yellow = "#aa9c8a"
blue = "#c4b5a1"
teal = "#c4b5a1"
mauve = "#aa9c8a"
peach = "#aa9c8a"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#242424" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#242424" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
