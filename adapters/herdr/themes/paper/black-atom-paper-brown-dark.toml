# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — PAPER ∷ Brown Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#e5ddd0"
panel_bg = "#131110"
surface_dim = "#131110"
surface0 = "#37322c"
surface1 = "#37322c"
overlay0 = "#9b9082"
overlay1 = "#83796a"
text = "#e8dccc"
subtext0 = "#9b9082"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#b4a99a"
mauve = "#9b9082"
peach = "#9b9082"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#e5ddd0" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#e5ddd0" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
