# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — PAPER ∷ Blue Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#275bff"
panel_bg = "#e4e8ef"
surface_dim = "#e4e8ef"
surface0 = "#f8fcff"
surface1 = "#f8fcff"
overlay0 = "#2955d3"
overlay1 = "#497cfd"
text = "#040089"
subtext0 = "#2955d3"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#5a8fff"
mauve = "#497cfd"
peach = "#497cfd"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#275bff" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#275bff" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
