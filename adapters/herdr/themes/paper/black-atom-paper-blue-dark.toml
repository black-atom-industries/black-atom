# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — PAPER ∷ Blue Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#fa8f19"
panel_bg = "#08173f"
surface_dim = "#08173f"
surface0 = "#1e305b"
surface1 = "#1e305b"
overlay0 = "#8098ca"
overlay1 = "#6379aa"
text = "#ebf2ff"
subtext0 = "#8098ca"
red = "#9eb7eb"
green = "#8098ca"
yellow = "#8098ca"
blue = "#9eb7eb"
teal = "#9eb7eb"
mauve = "#8098ca"
peach = "#8098ca"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#fa8f19" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#fa8f19" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
