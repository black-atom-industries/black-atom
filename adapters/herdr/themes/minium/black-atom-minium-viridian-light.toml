# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Minium ∷ Viridian Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#e95e00"
panel_bg = "#c2dfd4"
sidebar_bg = "#c2dfd4"
active_row_bg = "#dcf1e9"
selection_bg = "#aed5c6"
surface_dim = "#dcf1e9"
surface0 = "#f1fbf7"
surface1 = "#dcf1e9"
overlay0 = "#3a816a"
overlay1 = "#e95e00"
text = "#194034"
subtext0 = "#3a816a"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#00b37c"
mauve = "#bb929a"
peach = "#e95e00"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#e95e00" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#e95e00" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
