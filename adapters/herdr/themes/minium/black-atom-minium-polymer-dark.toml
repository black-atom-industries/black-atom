# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Minium ∷ Polymer Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#ff8352"
panel_bg = "#1d1d1d"
sidebar_bg = "#1d1d1d"
active_row_bg = "#252728"
selection_bg = "#404040"
surface_dim = "#252728"
surface0 = "#27292a"
surface1 = "#252728"
overlay0 = "#757b80"
overlay1 = "#ff8352"
text = "#cfcdcb"
subtext0 = "#757b80"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#939d9f"
mauve = "#757b80"
peach = "#d0e1e9"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#ff8352" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#ff8352" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
