# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Minium ∷ Viridian Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#ed9562"
panel_bg = "#12352a"
sidebar_bg = "#12352a"
active_row_bg = "#194034"
selection_bg = "#215848"
surface_dim = "#194034"
surface0 = "#204c3e"
surface1 = "#194034"
overlay0 = "#6fb59d"
overlay1 = "#ed9562"
text = "#dcf1e9"
subtext0 = "#6fb59d"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#47c7a2"
mauve = "#ecc1c9"
peach = "#e09f4d"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#ed9562" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#ed9562" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
