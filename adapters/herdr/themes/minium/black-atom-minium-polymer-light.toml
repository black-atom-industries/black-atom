# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Minium ∷ Polymer Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#f55d12"
panel_bg = "#cacacc"
sidebar_bg = "#cacacc"
active_row_bg = "#dbdbdb"
selection_bg = "#c4c4c4"
surface_dim = "#dbdbdb"
surface0 = "#ebebeb"
surface1 = "#dbdbdb"
overlay0 = "#46474c"
overlay1 = "#f55d12"
text = "#1d1d1d"
subtext0 = "#46474c"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#939d9f"
mauve = "#757b80"
peach = "#18171f"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#f55d12" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#f55d12" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
