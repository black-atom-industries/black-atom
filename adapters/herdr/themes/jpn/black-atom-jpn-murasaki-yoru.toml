# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — JPN ∷ Murasaki Yoru
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#dca23a"
panel_bg = "#250d15"
sidebar_bg = "#250d15"
active_row_bg = "#351b23"
selection_bg = "#5b3e47"
surface_dim = "#351b23"
surface0 = "##452a32"
surface1 = "##351b23"
overlay0 = "#946996"
overlay1 = "#dca23a"
text = "#d4bfd6"
subtext0 = "#946996"
red = "#ff857b"
green = "#80bda2"
yellow = "#dca23a"
blue = "#8cb6c5"
teal = "#72bdbc"
mauve = "#d49bb2"
peach = "#e89a47"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#dca23a" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#dca23a" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
