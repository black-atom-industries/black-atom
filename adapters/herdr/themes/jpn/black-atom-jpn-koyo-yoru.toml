[theme.custom]
accent = "#e49e22"
panel_bg = "#1c1121"
surface_dim = "#1c1121"
surface0 = "#3a2d3f"
surface1 = "#3a2d3f"
overlay0 = "#b19b7c"
overlay1 = "#927c5f"
text = "#ead2b2"
subtext0 = "#b19b7c"
red = "#fe838f"
green = "#7fc08c"
yellow = "#e49e22"
blue = "#b5a4d7"
teal = "#5cc3b0"
mauve = "#e19b73"
peach = "#f88f4f"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#e49e22" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#e49e22" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
