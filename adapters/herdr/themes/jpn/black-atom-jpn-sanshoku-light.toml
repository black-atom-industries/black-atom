# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — JPN ∷ Sanshoku Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#cc8f00"
panel_bg = "#b4c3c9"
sidebar_bg = "#b4c3c9"
active_row_bg = "#c3cfd4"
selection_bg = "#b4c3c9"
surface_dim = "#c3cfd4"
surface0 = "#d2dbdf"
surface1 = "#c3cfd4"
overlay0 = "#617683"
overlay1 = "#cc8f00"
text = "#0f212d"
subtext0 = "#617683"
red = "#db5241"
green = "#429c5a"
yellow = "#cc8f00"
blue = "#457ea1"
teal = "#1c989e"
mauve = "#c65b93"
peach = "#ac6900"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#cc8f00" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#cc8f00" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
