[theme.custom]
accent = "#eab899"
panel_bg = "#0f0f0f"
surface_dim = "#0f0f0f"
surface0 = "#282828"
surface1 = "#282828"
overlay0 = "#9d9daf"
overlay1 = "#828299"
text = "#e6e6e6"
subtext0 = "#9d9daf"
red = "#f591b2"
green = "#90b99f"
yellow = "#eab899"
blue = "#a1b0cf"
teal = "#8dd9c5"
mauve = "#aca1cf"
peach = "#f6a090"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#eab899" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#eab899" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
