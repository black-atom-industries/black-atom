# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — JPN ∷ Sanshoku Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#f8ac3d"
panel_bg = "#162f48"
sidebar_bg = "#162f48"
active_row_bg = "#1d364f"
selection_bg = "#2a435d"
surface_dim = "#1d364f"
surface0 = "#233c56"
surface1 = "#1d364f"
overlay0 = "#8ab2dc"
overlay1 = "#f8ac3d"
text = "#e2ebf3"
subtext0 = "#8ab2dc"
red = "#f86c59"
green = "#6fc483"
yellow = "#f8ac3d"
blue = "#76b1fc"
teal = "#53c1c7"
mauve = "#e274ab"
peach = "#d78c00"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#f8ac3d" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#f8ac3d" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
