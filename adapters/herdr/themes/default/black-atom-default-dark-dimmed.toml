# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Dark Dimmed
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#4ec983"
panel_bg = "#12171b"
sidebar_bg = "#12171b"
active_row_bg = "#20252a"
selection_bg = "#3e4349"
surface_dim = "#20252a"
surface0 = "##2e3339"
surface1 = "##20252a"
overlay0 = "#7b8187"
overlay1 = "#4ec983"
text = "#e5ecf3"
subtext0 = "#7b8187"
red = "#e97292"
green = "#4cb86a"
yellow = "#dd881b"
blue = "#00b9c3"
teal = "#4ec983"
mauve = "#7faaff"
peach = "#7b8187"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#4ec983" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#4ec983" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
