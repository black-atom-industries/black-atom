# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Light Dimmed
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#2eaf6b"
panel_bg = "#c8ced5"
sidebar_bg = "#c8ced5"
active_row_bg = "#e5ecf3"
selection_bg = "#a8afb5"
surface_dim = "#c8ced5"
surface0 = "#e5ecf3"
surface1 = "#e5ecf3"
overlay0 = "#43484e"
overlay1 = "#646a70"
text = "#0e1217"
subtext0 = "#43484e"
red = "#ff50a7"
green = "#00a800"
yellow = "#ff7e00"
blue = "#00abc1"
teal = "#2eaf6b"
mauve = "#6791f1"
peach = "#646a70"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#2eaf6b" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#2eaf6b" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
