# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#4ec983"
panel_bg = "#090e12"
surface_dim = "#090e12"
surface0 = "#1b2025"
surface1 = "#1b2025"
overlay0 = "#7b8187"
overlay1 = "#6a6f76"
text = "#e5ecf3"
subtext0 = "#7b8187"
red = "#8d9399"
green = "#8d9399"
yellow = "#7b8187"
blue = "#6a6f76"
teal = "#4ec983"
mauve = "#7faaff"
peach = "#7b8187"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#4ec983" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#4ec983" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
