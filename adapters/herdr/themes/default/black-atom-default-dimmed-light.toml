# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Dimmed Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#19b168"
panel_bg = "#cbd2d9"
sidebar_bg = "#cbd2d9"
active_row_bg = "#dfe5ec"
selection_bg = "#b8bec5"
surface_dim = "#dfe5ec"
surface0 = "#ecf3fa"
surface1 = "#dfe5ec"
overlay0 = "#43484e"
overlay1 = "#19b168"
text = "#0e1217"
subtext0 = "#43484e"
red = "#fb80aa"
green = "#11a22f"
yellow = "#f29520"
blue = "#1c989e"
teal = "#19b168"
mauve = "#6390fa"
peach = "#646a70"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#19b168" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#19b168" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
