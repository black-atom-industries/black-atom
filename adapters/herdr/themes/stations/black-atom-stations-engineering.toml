[theme.custom]
accent = "#c6de68"
panel_bg = "#030b0b"
sidebar_bg = "#030b0b"
active_row_bg = "#1c2626"
selection_bg = "#2a3535"
surface_dim = "#030b0b"
surface0 = "#1c2626"
surface1 = "#1c2626"
overlay0 = "#91bcad"
overlay1 = "#75a490"
text = "#d5f4e3"
subtext0 = "#91bcad"
red = "#f08cb4"
green = "#7fcd81"
yellow = "#c6de68"
blue = "#c3eed9"
teal = "#81d6a5"
mauve = "#a5a9e5"
peach = "#e9b64b"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#c6de68" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#c6de68" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
