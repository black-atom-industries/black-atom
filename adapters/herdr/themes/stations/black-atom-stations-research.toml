[theme.custom]
accent = "#66bd10"
panel_bg = "#edf1ef"
sidebar_bg = "#edf1ef"
active_row_bg = "#f8f9f9"
selection_bg = "#e3e8e6"
surface_dim = "#f8f9f9"
surface0 = "##e3e8e6"
surface1 = "##f8f9f9"
overlay0 = "#75a490"
overlay1 = "#66bd10"
text = "#2b3b33"
subtext0 = "#75a490"
red = "#f472a0"
green = "#53aa53"
yellow = "#66bd10"
blue = "#51796d"
teal = "#40bf75"
mauve = "#998ed9"
peach = "#f2a100"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#66bd10" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#66bd10" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
