[theme.custom]
accent = "#66bd10"
panel_bg = "#d4dcd8"
sidebar_bg = "#d4dcd8"
active_row_bg = "#e1e7e4"
selection_bg = "#c6d1cc"
surface_dim = "#e1e7e4"
surface0 = "##c6d1cc"
surface1 = "##e1e7e4"
overlay0 = "#669a84"
overlay1 = "#66bd10"
text = "#2b3b33"
subtext0 = "#669a84"
red = "#f472a0"
green = "#3c8e3c"
yellow = "#66bd10"
blue = "#476a5f"
teal = "#40bf75"
mauve = "#998ed9"
peach = "#f2a100"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#66bd10" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#66bd10" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
