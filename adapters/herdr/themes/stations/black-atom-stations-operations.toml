[theme.custom]
accent = "#b7db6e"
panel_bg = "#192323"
surface_dim = "#192323"
surface0 = "#293c36"
surface1 = "#293c36"
overlay0 = "#91bcad"
overlay1 = "#75a490"
text = "#c1efd5"
subtext0 = "#91bcad"
red = "#f08cb4"
green = "#80c980"
yellow = "#b7db6e"
blue = "#abe7ca"
teal = "#75d69e"
mauve = "#b6bee0"
peach = "#e9b565"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#b7db6e" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#b7db6e" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
