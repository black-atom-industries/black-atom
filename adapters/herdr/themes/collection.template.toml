<%
function mixHex(from, toward, amount) {
    const fromRgb = from.slice(1).match(/../g).map((part) => Number.parseInt(part, 16));
    const towardRgb = toward.slice(1).match(/../g).map((part) => Number.parseInt(part, 16));
    const channels = fromRgb.map((channel, index) =>
        Math.round(channel + (towardRgb[index] - channel) * amount)
            .toString(16)
            .padStart(2, "0")
    );
    return `#${channels.join("")}`;
}

const surface = mixHex(theme.ui.bg.active, theme.ui.fg.disabled, 0.10);
const baseTheme = theme.meta.appearance === "light" ? "catppuccin-latte" : "catppuccin";
%># BEGIN BLACK ATOM LIVERY THEME
# <%= theme.meta.label %>
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme]
name = "<%= baseTheme %>"

[theme.custom]
accent = "<%= theme.ui.fg.accent %>"
panel_bg = "<%= theme.ui.bg.panel %>"
surface_dim = "<%= theme.ui.bg.panel %>"
surface0 = "<%= theme.ui.bg.active %>"
surface1 = "<%= surface %>"
overlay0 = "<%= theme.ui.fg.subtle %>"
overlay1 = "<%= theme.ui.fg.disabled %>"
text = "<%= theme.ui.fg.default %>"
subtext0 = "<%= theme.ui.fg.subtle %>"
red = "<%= theme.palette.red %>"
green = "<%= theme.palette.green %>"
yellow = "<%= theme.palette.yellow %>"
blue = "<%= theme.palette.blue %>"
teal = "<%= theme.palette.cyan %>"
mauve = "<%= theme.palette.magenta %>"
peach = "<%= theme.palette.darkYellow %>"
# END BLACK ATOM LIVERY THEME
