<%
function mix(from, to, amount) {
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const a = rgb(from);
  const b = rgb(to);
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * amount).toString(16).padStart(2, "0")).join("");
}

const accentSidebar = theme.meta.collection.key === "facility";
const ink = theme.meta.appearance === "dark" ? theme.ui.bg.default : theme.ui.fg.default;
const inkSubtle = mix(ink, theme.ui.fg.accent, 0.3);
const sidebarBg = accentSidebar ? theme.ui.fg.accent : theme.ui.bg.panel;
const activeRowBg = accentSidebar ? mix(theme.ui.fg.accent, ink, 0.12) : theme.ui.bg.default;
const selectionBg = accentSidebar ? mix(theme.ui.fg.accent, ink, 0.2) : theme.ui.bg.selection;
const muted = accentSidebar ? mix(theme.ui.fg.subtle, ink, theme.meta.appearance === "dark" ? 0.4 : 0.7) : theme.ui.fg.subtle;
_%>
# BEGIN BLACK ATOM LIVERY THEME
# <%= theme.meta.label %>
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "<%= theme.ui.fg.accent %>"
panel_bg = "<%= theme.ui.bg.panel %>"
sidebar_bg = "<%= sidebarBg %>"
active_row_bg = "<%= activeRowBg %>"
selection_bg = "<%= selectionBg %>"
surface_dim = "<%= theme.ui.bg.default %>"
surface0 = "<%= theme.ui.bg.active %>"
surface1 = "<%= theme.ui.bg.default %>"
overlay0 = "<%= muted %>"
overlay1 = "<%= theme.ui.fg.accent %>"
text = "<%= theme.ui.fg.default %>"
subtext0 = "<%= muted %>"
red = "<%= theme.ui.fg.negative %>"
green = "<%= theme.ui.fg.positive %>"
yellow = "<%= theme.ui.fg.warn %>"
blue = "<%= theme.ui.fg.info %>"
teal = "<%= theme.palette.cyan %>"
mauve = "<%= theme.palette.magenta %>"
peach = "<%= theme.palette.darkYellow %>"

<% if (accentSidebar) { -%>
[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "<%= ink %>" },
    { token = "workspace", bold = true, fg = "<%= ink %>" },
  ],
  [
    { token = "branch", fg = "<%= inkSubtle %>" },
    { token = "git_status", fg = "<%= inkSubtle %>" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "<%= ink %>" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "<%= inkSubtle %>" },
  ],
  [
    { token = "state_icon", fg = "<%= ink %>" },
    { token = "state_text", fg = "<%= ink %>" },
    { token = "agent", fg = "<%= inkSubtle %>" },
  ],
]
<% } else { -%>
[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "<%= theme.ui.fg.accent %>" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "<%= theme.ui.fg.accent %>" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
<% } -%>
# END BLACK ATOM LIVERY THEME
