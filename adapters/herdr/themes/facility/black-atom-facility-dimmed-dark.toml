# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Facility ∷ Dimmed Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#dbee7a"
panel_bg = "#131717"
sidebar_bg = "#dbee7a"
active_row_bg = "#c4d56f"
selection_bg = "#b5c568"
surface_dim = "#1c2020"
surface0 = "#242a2a"
surface1 = "#1c2020"
overlay0 = "#627e75"
overlay1 = "#dbee7a"
text = "#c1efd5"
subtext0 = "#627e75"
red = "#f08cb4"
green = "#80c980"
yellow = "#dbee7a"
blue = "#abe7ca"
teal = "#75d69e"
mauve = "#b6bee0"
peach = "#e9b565"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "#1c2020" },
    { token = "workspace", bold = true, fg = "#1c2020" },
  ],
  [
    { token = "branch", fg = "#555e3b" },
    { token = "git_status", fg = "#555e3b" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#1c2020" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "#555e3b" },
  ],
  [
    { token = "state_icon", fg = "#1c2020" },
    { token = "state_text", fg = "#1c2020" },
    { token = "agent", fg = "#555e3b" },
  ],
]
# END BLACK ATOM LIVERY THEME
