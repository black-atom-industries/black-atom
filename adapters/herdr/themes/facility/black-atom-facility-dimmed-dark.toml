# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Facility ∷ Dimmed Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#e7fc7c"
panel_bg = "#131717"
sidebar_bg = "#e7fc7c"
active_row_bg = "#cfe271"
selection_bg = "#bed06a"
surface_dim = "#1c2020"
surface0 = "#242a2a"
surface1 = "#1c2020"
overlay0 = "#627e75"
overlay1 = "#e7fc7c"
text = "#c1efd5"
subtext0 = "#627e75"
red = "#ffa9d2"
green = "#96e497"
yellow = "#e7fc7c"
blue = "#abe7ca"
teal = "#8ee4b2"
mauve = "#c3c8ff"
peach = "#f9c55c"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "#1c2020" },
    { token = "workspace", bold = true, fg = "#1c2020" },
  ],
  [
    { token = "branch", fg = "#59623c" },
    { token = "git_status", fg = "#59623c" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#1c2020" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "#59623c" },
  ],
  [
    { token = "state_icon", fg = "#1c2020" },
    { token = "state_text", fg = "#1c2020" },
    { token = "agent", fg = "#59623c" },
  ],
]
# END BLACK ATOM LIVERY THEME
