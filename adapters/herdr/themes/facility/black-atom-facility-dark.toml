# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Facility ∷ Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#e7fc7c"
panel_bg = "#040606"
sidebar_bg = "#e7fc7c"
active_row_bg = "#cde06f"
selection_bg = "#bbcd66"
surface_dim = "#0c1010"
surface0 = "#191e1e"
surface1 = "#0c1010"
overlay0 = "#5c776e"
overlay1 = "#e7fc7c"
text = "#d5f4e3"
subtext0 = "#5c776e"
red = "#ffa9d2"
green = "#96e497"
yellow = "#e7fc7c"
blue = "#c3eed9"
teal = "#8ee4b2"
mauve = "#c3c8ff"
peach = "#f9c55c"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "#0c1010" },
    { token = "workspace", bold = true, fg = "#0c1010" },
  ],
  [
    { token = "branch", fg = "#4e5730" },
    { token = "git_status", fg = "#4e5730" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#0c1010" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "#4e5730" },
  ],
  [
    { token = "state_icon", fg = "#0c1010" },
    { token = "state_text", fg = "#0c1010" },
    { token = "agent", fg = "#4e5730" },
  ],
]
# END BLACK ATOM LIVERY THEME
