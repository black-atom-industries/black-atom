# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Facility ∷ Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#e2f776"
panel_bg = "#040606"
sidebar_bg = "#e2f776"
active_row_bg = "#c8db6a"
selection_bg = "#b7c962"
surface_dim = "#0c1010"
surface0 = "#191e1e"
surface1 = "#0c1010"
overlay0 = "#5c776e"
overlay1 = "#e2f776"
text = "#d5f4e3"
subtext0 = "#5c776e"
red = "#f08cb4"
green = "#7fcd81"
yellow = "#e2f776"
blue = "#c3eed9"
teal = "#81d6a5"
mauve = "#a5a9e5"
peach = "#e9b64b"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "#0c1010" },
    { token = "workspace", bold = true, fg = "#0c1010" },
  ],
  [
    { token = "branch", fg = "#4c552f" },
    { token = "git_status", fg = "#4c552f" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#0c1010" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "#4c552f" },
  ],
  [
    { token = "state_icon", fg = "#0c1010" },
    { token = "state_text", fg = "#0c1010" },
    { token = "agent", fg = "#4c552f" },
  ],
]
# END BLACK ATOM LIVERY THEME
