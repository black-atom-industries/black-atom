# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Facility ∷ Dimmed Light
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#a8ba33"
panel_bg = "#dee4e4"
sidebar_bg = "#a8ba33"
active_row_bg = "#99ab33"
selection_bg = "#8fa133"
surface_dim = "#eaf0f0"
surface0 = "#d2d9d9"
surface1 = "#eaf0f0"
overlay0 = "#3d584b"
overlay1 = "#a8ba33"
text = "#2b3b33"
subtext0 = "#3d584b"
red = "#cb4c7c"
green = "#3f9640"
yellow = "#a8ba33"
blue = "#476a5f"
teal = "#009a52"
mauve = "#8074bd"
peach = "#d7a537"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "#2b3b33" },
    { token = "workspace", bold = true, fg = "#2b3b33" },
  ],
  [
    { token = "branch", fg = "#516133" },
    { token = "git_status", fg = "#516133" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#2b3b33" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "#516133" },
  ],
  [
    { token = "state_icon", fg = "#2b3b33" },
    { token = "state_text", fg = "#2b3b33" },
    { token = "agent", fg = "#516133" },
  ],
]
# END BLACK ATOM LIVERY THEME
