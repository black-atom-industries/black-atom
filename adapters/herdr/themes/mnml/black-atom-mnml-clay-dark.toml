[theme.custom]
accent = "#fc8a61"
panel_bg = "#23211c"
sidebar_bg = "#23211c"
active_row_bg = "#3c3a35"
selection_bg = "#4a4842"
surface_dim = "#23211c"
surface0 = "#3c3a35"
surface1 = "#3c3a35"
overlay0 = "#a49e8d"
overlay1 = "#868070"
text = "#e3decc"
subtext0 = "#a49e8d"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#b4ae9c"
mauve = "#a49e8d"
peach = "#a49e8d"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#fc8a61" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#fc8a61" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
