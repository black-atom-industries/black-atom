[theme.custom]
accent = "#1085fc"
panel_bg = "#f2eae2"
surface_dim = "#f2eae2"
surface0 = "#fffbf5"
surface1 = "#fffbf5"
overlay0 = "#6c6158"
overlay1 = "#897e74"
text = "#38312b"
subtext0 = "#6c6158"
red = "#f1342d"
green = "#897e74"
yellow = "#897e74"
blue = "#1085fc"
teal = "#988d83"
mauve = "#897e74"
peach = "#897e74"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#1085fc" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#1085fc" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
