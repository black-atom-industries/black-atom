[theme.custom]
accent = "#1085fc"
panel_bg = "#f2eae2"
sidebar_bg = "#f2eae2"
active_row_bg = "#fff7f0"
selection_bg = "#e4dcd6"
surface_dim = "#fff7f0"
surface0 = "##fffbf5"
surface1 = "##fff7f0"
overlay0 = "#6c6158"
overlay1 = "#1085fc"
text = "#38312b"
subtext0 = "#6c6158"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#988d83"
mauve = "#897e74"
peach = "#897e74"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#1085fc" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#1085fc" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
