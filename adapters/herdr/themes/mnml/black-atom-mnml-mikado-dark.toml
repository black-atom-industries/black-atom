# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — MNML ∷ Mikado Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#f8ac3d"
panel_bg = "#162f48"
sidebar_bg = "#162f48"
active_row_bg = "#1d364f"
selection_bg = "#2a435d"
surface_dim = "#1d364f"
surface0 = "##233c56"
surface1 = "##1d364f"
overlay0 = "#6c93bc"
overlay1 = "#f8ac3d"
text = "#e2ebf3"
subtext0 = "#6c93bc"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#8ab2dc"
mauve = "#6c93bc"
peach = "#f8ac3d"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#f8ac3d" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#f8ac3d" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
