[theme.custom]
accent = "#2e2e2e"
panel_bg = "#f1eeeb"
sidebar_bg = "#f1eeeb"
active_row_bg = "#fffffc"
selection_bg = "#e0ddda"
surface_dim = "#f1eeeb"
surface0 = "#fffffc"
surface1 = "#fffffc"
overlay0 = "#8e8c89"
overlay1 = "#b3b0ae"
text = "#181614"
subtext0 = "#8e8c89"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#c6c3c1"
mauve = "#b3b0ae"
peach = "#b3b0ae"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#2e2e2e" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#2e2e2e" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
