# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — MNML ∷ Mono Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#e4e4e4"
panel_bg = "#070504"
sidebar_bg = "#070504"
active_row_bg = "#0f0d0b"
selection_bg = "#2b2826"
surface_dim = "#0f0d0b"
surface0 = "##1c1a18"
surface1 = "##0f0d0b"
overlay0 = "#82807d"
overlay1 = "#e4e4e4"
text = "#edeae8"
subtext0 = "#82807d"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#a09e9b"
mauve = "#82807d"
peach = "#82807d"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#e4e4e4" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#e4e4e4" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
