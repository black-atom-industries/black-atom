[theme.custom]
accent = "#e4e4e4"
panel_bg = "#070504"
surface_dim = "#070504"
surface0 = "#1c1a18"
surface1 = "#1c1a18"
overlay0 = "#82807d"
overlay1 = "#656360"
text = "#edeae8"
subtext0 = "#82807d"
red = "#a09e9b"
green = "#82807d"
yellow = "#82807d"
blue = "#a09e9b"
teal = "#a09e9b"
