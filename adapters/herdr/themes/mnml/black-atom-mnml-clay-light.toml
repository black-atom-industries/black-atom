[theme.custom]
accent = "#e76b3e"
panel_bg = "#ebe5cf"
surface_dim = "#ebe5cf"
surface0 = "#fff9e2"
surface1 = "#fff9e2"
overlay0 = "#5d553f"
overlay1 = "#79715a"
text = "#322e22"
subtext0 = "#5d553f"
red = "#888069"
green = "#79715a"
yellow = "#79715a"
blue = "#888069"
