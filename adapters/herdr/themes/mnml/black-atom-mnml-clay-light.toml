[theme.custom]
accent = "#e76b3e"
panel_bg = "#ebe5cf"
sidebar_bg = "#ebe5cf"
active_row_bg = "#f8f2dc"
selection_bg = "#ddd8c2"
surface_dim = "#f8f2dc"
surface0 = "##fff9e2"
surface1 = "##f8f2dc"
overlay0 = "#5d553f"
overlay1 = "#e76b3e"
text = "#322e22"
subtext0 = "#5d553f"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#888069"
mauve = "#79715a"
peach = "#79715a"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#e76b3e" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#e76b3e" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
