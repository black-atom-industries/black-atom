[theme.custom]
accent = "#3dc7a9"
panel_bg = "#151712"
sidebar_bg = "#151712"
active_row_bg = "#20231b"
selection_bg = "#434b36"
surface_dim = "#20231b"
surface0 = "##373d2f"
surface1 = "##20231b"
overlay0 = "#7a8568"
overlay1 = "#3dc7a9"
text = "#ffe7c7"
subtext0 = "#7a8568"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#98a485"
mauve = "#7a8568"
peach = "#fa8e3c"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#3dc7a9" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#3dc7a9" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
