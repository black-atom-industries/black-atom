[theme.custom]
accent = "#5f5155"
panel_bg = "#d1d1d1"
surface_dim = "#d1d1d1"
surface0 = "#ebebeb"
surface1 = "#ebebeb"
overlay0 = "#5d5d5d"
overlay1 = "#8c8c8c"
text = "#292929"
subtext0 = "#5d5d5d"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#a4a4a4"
mauve = "#8c8c8c"
peach = "#8c8c8c"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#5f5155" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#5f5155" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
