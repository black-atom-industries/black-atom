[theme.custom]
accent = "#cc8f00"
panel_bg = "#b4c3c9"
surface_dim = "#b4c3c9"
surface0 = "#d2dbdf"
surface1 = "#d2dbdf"
overlay0 = "#4c5d67"
overlay1 = "#617683"
text = "#0f212d"
subtext0 = "#4c5d67"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#7b919d"
mauve = "#617683"
peach = "#617683"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#cc8f00" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#cc8f00" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
