[theme.custom]
accent = "#fc8e06"
panel_bg = "#eef3f4"
surface_dim = "#eef3f4"
surface0 = "#fcffff"
surface1 = "#fcffff"
overlay0 = "#585f61"
overlay1 = "#868e90"
text = "#242a2c"
subtext0 = "#585f61"
red = "#f14d4c"
green = "#819e00"
yellow = "#cd7b00"
blue = "#00a3e9"
teal = "#9ea6a9"
mauve = "#868e90"
peach = "#0795fd"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#fc8e06" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#fc8e06" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
