[theme.custom]
accent = "#fc8e06"
panel_bg = "#000203"
surface_dim = "#000203"
surface0 = "#090e10"
surface1 = "#090e10"
overlay0 = "#868e90"
overlay1 = "#747c7e"
text = "#f2fafd"
subtext0 = "#868e90"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#9ea6a9"
mauve = "#868e90"
peach = "#1a97fc"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#fc8e06" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#fc8e06" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
