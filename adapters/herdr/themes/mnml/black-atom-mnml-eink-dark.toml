# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — MNML ∷ E-Ink Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#d2b5bd"
panel_bg = "#090909"
sidebar_bg = "#090909"
active_row_bg = "#161616"
selection_bg = "#2e2e2e"
surface_dim = "#161616"
surface0 = "##242424"
surface1 = "##161616"
overlay0 = "#8c8c8c"
overlay1 = "#d2b5bd"
text = "#dedede"
subtext0 = "#8c8c8c"
red = "#dd7577"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#a4a4a4"
mauve = "#8c8c8c"
peach = "#8c8c8c"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#d2b5bd" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#d2b5bd" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
