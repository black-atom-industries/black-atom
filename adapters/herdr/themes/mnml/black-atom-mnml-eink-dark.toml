[theme.custom]
accent = "#d2b5bd"
panel_bg = "#090909"
surface_dim = "#090909"
surface0 = "#242424"
surface1 = "#242424"
overlay0 = "#8c8c8c"
overlay1 = "#7a7a7a"
text = "#dedede"
subtext0 = "#8c8c8c"
red = "#a4a4a4"
green = "#8c8c8c"
yellow = "#8c8c8c"
blue = "#a4a4a4"
teal = "#a4a4a4"
mauve = "#8c8c8c"
peach = "#8c8c8c"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#d2b5bd" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#d2b5bd" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
