[theme.custom]
accent = "#fa9916"
panel_bg = "#dfe5ef"
sidebar_bg = "#dfe5ef"
active_row_bg = "#ebeff5"
selection_bg = "#f6f9fc"
surface_dim = "#ebeff5"
surface0 = "##cfd8e5"
surface1 = "##ebeff5"
overlay0 = "#4f667c"
overlay1 = "#fa9916"
text = "#1e2a37"
subtext0 = "#4f667c"
red = "#6e6ab2"
green = "#208295"
yellow = "#fa9916"
blue = "#3578b8"
teal = "#008c99"
mauve = "#7968a9"
peach = "#fa6c14"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#fa9916" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#fa9916" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
