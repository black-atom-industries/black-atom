# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — TERRA ∷ Summer Day
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#c67b36"
panel_bg = "#eee4cf"
sidebar_bg = "#eee4cf"
active_row_bg = "#e4dec8"
selection_bg = "#ffeedd"
surface_dim = "#eee4cf"
surface0 = "#e4dec8"
surface1 = "#e4dec8"
overlay0 = "#26541c"
overlay1 = "#506e2c"
text = "#00280f"
subtext0 = "#26541c"
red = "#ac6e59"
green = "#768c00"
yellow = "#c67b36"
blue = "#5a8f65"
teal = "#459178"
mauve = "#b67c8d"
peach = "#c67b36"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#c67b36" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#c67b36" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
