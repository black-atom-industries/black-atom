# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — TERRA ∷ Summer Night
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#bcb067"
panel_bg = "#001113"
sidebar_bg = "#001113"
active_row_bg = "#001b1a"
selection_bg = "#2a433a"
surface_dim = "#001b1a"
surface0 = "##092520"
surface1 = "##001b1a"
overlay0 = "#94a585"
overlay1 = "#bcb067"
text = "#dfcbaa"
subtext0 = "#94a585"
red = "#c88f7b"
green = "#96a85e"
yellow = "#bcb067"
blue = "#89a88e"
teal = "#6aae9c"
mauve = "#ba929d"
peach = "#dba06f"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#bcb067" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#bcb067" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
