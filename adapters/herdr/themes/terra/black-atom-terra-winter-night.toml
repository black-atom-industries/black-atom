# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — TERRA ∷ Winter Night
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#fba952"
panel_bg = "#0b0d12"
sidebar_bg = "#0b0d12"
active_row_bg = "#12161d"
selection_bg = "#212f3f"
surface_dim = "#12161d"
surface0 = "##1a222e"
surface1 = "##12161d"
overlay0 = "#6f8298"
overlay1 = "#fba952"
text = "#e2e8f2"
subtext0 = "#6f8298"
red = "#a8a6e5"
green = "#82c3d3"
yellow = "#fba952"
blue = "#7fb6ee"
teal = "#71cfd9"
mauve = "#b4a7df"
peach = "#eb8656"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#fba952" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#fba952" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
