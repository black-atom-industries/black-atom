# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — TERRA ∷ Fall Night
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#d68c00"
panel_bg = "#1b0e08"
sidebar_bg = "#1b0e08"
active_row_bg = "#241710"
selection_bg = "#382a23"
surface_dim = "#241710"
surface0 = "##2e2119"
surface1 = "##241710"
overlay0 = "#c59174"
overlay1 = "#d68c00"
text = "#eac5b1"
subtext0 = "#c59174"
red = "#e87a69"
green = "#95a483"
yellow = "#d68c00"
blue = "#d08c62"
teal = "#7ea99c"
mauve = "#d4896e"
peach = "#e67f3c"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#d68c00" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#d68c00" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
