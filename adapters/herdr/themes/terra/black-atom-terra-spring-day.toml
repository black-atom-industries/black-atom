# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — TERRA ∷ Spring Day
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#e49f1a"
panel_bg = "#c7d1cc"
sidebar_bg = "#c7d1cc"
active_row_bg = "#b9c6bf"
selection_bg = "#e2eae6"
surface_dim = "#c7d1cc"
surface0 = "#b9c6bf"
surface1 = "#b9c6bf"
overlay0 = "#55816a"
overlay1 = "#62937a"
text = "#385547"
subtext0 = "#55816a"
red = "#dd7e5d"
green = "#11b066"
yellow = "#e49f1a"
blue = "#588dc1"
teal = "#0fab6a"
mauve = "#a586c6"
peach = "#de7b1f"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#e49f1a" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#e49f1a" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
