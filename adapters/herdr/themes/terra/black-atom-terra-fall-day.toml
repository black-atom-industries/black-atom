[theme.custom]
accent = "#d9710b"
panel_bg = "#eeceb6"
sidebar_bg = "#eeceb6"
active_row_bg = "#e3bfa4"
selection_bg = "#ffe6d2"
surface_dim = "#eeceb6"
surface0 = "#e3bfa4"
surface1 = "#e3bfa4"
overlay0 = "#815137"
overlay1 = "#9b6a4f"
text = "#422617"
subtext0 = "#815137"
red = "#bf4d3f"
green = "#6d7e57"
yellow = "#d9710b"
blue = "#956d57"
teal = "#4f8375"
mauve = "#a26650"
peach = "#e16648"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#d9710b" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#d9710b" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
