# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — TERRA ∷ Spring Night
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#d1a762"
panel_bg = "#1d201f"
sidebar_bg = "#1d201f"
active_row_bg = "#212523"
selection_bg = "#313634"
surface_dim = "#212523"
surface0 = "##272c2a"
surface1 = "##212523"
overlay0 = "#82978c"
overlay1 = "#d1a762"
text = "#d6d0c2"
subtext0 = "#82978c"
red = "#ba6e5f"
green = "#92d49a"
yellow = "#d1a762"
blue = "#99b9e6"
teal = "#85ad9f"
mauve = "#c6b3da"
peach = "#e89a61"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#d1a762" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#d1a762" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME
