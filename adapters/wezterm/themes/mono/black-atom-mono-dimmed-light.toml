[metadata]
author = "Black Atom Industries"
name = "Black Atom — Mono ∷ Dimmed Light"

[colors]
foreground = "#292929"
background = "#dedede"
cursor_bg = "#5f5155"
cursor_border = "#5f5155"
cursor_fg = "#dedede"
selection_bg = "#c4c4c4"
selection_fg = "#292929"
split = "#5f5155"
compose_cursor = "#c21725"
scrollbar_thumb = "#525252"

ansi = [
  "#4d4d4d", # black
  "#505050", # dark_red
  "#2b2b2b", # dark_green
  "#505050", # dark_yellow
  "#0b0b0b", # dark_blue
  "#0b0b0b", # dark_magenta
  "#2b2b2b", # dark_cyan
  "#747474" # light_gray
]

brights = [
  "#525252", # gray
  "#636363", # red
  "#3d3d3d", # green
  "#636363", # yellow
  "#1a1a1a", # blue
  "#1a1a1a", # magenta
  "#3d3d3d", # cyan
  "#c4c4c4" # white
]

[colors.tab_bar]
inactive_tab_edge = "#d1d1d1"
background = "#dedede"

[colors.tab_bar.active_tab]
fg_color = "#d1d1d1"
bg_color = "#5f5155"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
fg_color = "#d1d1d1"
bg_color = "#c4c4c4"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#d1d1d1"
bg_color = "#d1d1d1"

[colors.tab_bar.new_tab]
fg_color = "#d1d1d1"
bg_color = "#5d7600"

[colors.tab_bar.new_tab_hover]
fg_color = "#d1d1d1"
bg_color = "#d1d1d1"
intensity = "Bold"
