[metadata]
author = "Black Atom Industries"
name = "Black Atom — Minium ∷ Sienna Light"

[colors]
foreground = "#1f1c1b"
background = "#dfdad2"
cursor_bg = "#fd4200"
cursor_border = "#fd4200"
cursor_fg = "#dfdad2"
selection_bg = "#c8c3be"
