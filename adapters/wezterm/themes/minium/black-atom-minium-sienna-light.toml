  "#a09a95", # dark_blue
  "#7e7974", # dark_magenta
  "#a09a95", # dark_cyan
  "#a09a95" # light_gray
]

brights = [
  "#4b4745", # gray
  "#a09a95", # red
  "#7e7974", # green
  "#fd4200", # yellow
  "#a09a95", # blue
  "#7e7974", # magenta
