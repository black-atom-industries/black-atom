intensity = "Bold"

[colors.tab_bar.inactive_tab]
fg_color = "#fef2e1"
bg_color = "#d1ba9b"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#fef2e1"
bg_color = "#f8e7d0"

[colors.tab_bar.new_tab]
fg_color = "#fef2e1"
bg_color = "#00812b"

[colors.tab_bar.new_tab_hover]
fg_color = "#fef2e1"
bg_color = "#f8e7d0"
intensity = "Bold"
