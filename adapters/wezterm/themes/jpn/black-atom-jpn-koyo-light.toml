[metadata]
author = "Black Atom Industries"
name = "Black Atom — JPN ∷ Koyo Light"

[colors]
foreground = "#3a2e3b"
background = "#fef2e1"
cursor_bg = "#ed9a00"
cursor_border = "#ed9a00"
cursor_fg = "#fef2e1"
selection_bg = "#f8e7d0"
selection_fg = "#3a2e3b"
split = "#ed9a00"
compose_cursor = "#dc094a"
scrollbar_thumb = "#9b8568"

ansi = [
  "#634c64", # black
  "#b7445d", # dark_red
  "#05893e", # dark_green
  "#ed6100", # dark_yellow
  "#d1649c", # dark_blue
  "#e46900", # dark_magenta
  "#008c75", # dark_cyan
  "#d1ba9b" # light_gray
]

brights = [
  "#725a73", # gray
  "#dc094a", # red
  "#00812b", # green
  "#d27500", # yellow
  "#8755cd", # blue
  "#ed6100", # magenta
  "#00a085", # cyan
  "#f2daba" # white
]

[colors.tab_bar]
inactive_tab_edge = "#f8e7d0"
background = "#fef2e1"

[colors.tab_bar.active_tab]
