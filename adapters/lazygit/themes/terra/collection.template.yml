# <%= theme.meta.label %>
# Black Atom Industries - Lazygit Theme
# https://github.com/black-atom-industries

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "<%= theme.ui.fg.accent %>"
      - bold
    inactiveBorderColor:
      - "<%= theme.ui.fg.border %>"
    optionsTextColor:
      - "<%= theme.ui.fg.info %>"
    selectedLineBgColor:
      - "<%= theme.ui.bg.selection %>"
    cherryPickedCommitBgColor:
      - "<%= theme.ui.bg.info %>"
    cherryPickedCommitFgColor:
      - "<%= theme.ui.fg.info %>"
    markedBaseCommitBgColor:
      - "<%= theme.ui.bg.warn %>"
    markedBaseCommitFgColor:
      - "<%= theme.ui.fg.default %>"
    unstagedChangesColor:
      - "<%= theme.ui.fg.negative %>"
    defaultFgColor:
      - "<%= theme.ui.fg.default %>"
    searchingActiveBorderColor:
      - "<%= theme.ui.fg.warn %>"

  authorColors:
    "*": "<%= theme.palette.magenta %>"
