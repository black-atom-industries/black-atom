[package]
name = "livery-gui"
version = "0.6.0"
description = "Paint your cockpit — Black Atom theme management"
authors = ["Black Atom Industries"]
license = "MIT"
repository = "https://github.com/nikbrunner/black-atom"
edition = "2021"
rust-version = "1.82"
default-run = "livery-gui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "livery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "livery-gui"
path = "src/main.rs"

[[bin]]
name = "perf-benchmark"
path = "src/bin/perf_benchmark.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
livery_core = { path = "../core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6"
tauri = { version = "~2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["typescript"] }
specta-typescript = "0.0.7"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
