name: release
on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: .github/release-please-config.json
                  manifest-file: .github/.release-please-manifest.json

            # When release-please creates/updates a release PR, regenerate Cargo.lock
            # so it stays in sync with the version bumps in Cargo.toml
            - uses: actions/checkout@v4
              if: steps.release.outputs.prs_created == 'true'
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

            - name: Update Cargo.lock
              if: steps.release.outputs.prs_created == 'true'
              run: cargo update --workspace

            - name: Commit Cargo.lock
              if: steps.release.outputs.prs_created == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Cargo.lock
                  git diff --cached --quiet || git commit -m "chore: sync Cargo.lock with version bump"
                  git push

    publish:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
                  fetch-depth: 0

            - name: extract release notes
              env:
                  VERSION: ${{ needs.release-please.outputs.version }}
              run: |
                  awk -v heading="## \`${VERSION}\`" '
                    index($0, heading) == 1 { found = 1; next }
                    found && /^---$/ { exit }
                    found { print }
                  ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
                  if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
                    echo "CHANGELOG.md has no section for ${VERSION}" >&2
                    exit 1
                  fi

            - name: replace release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.release-please.outputs.tag_name }}
              run: gh release edit "$TAG" --notes-file "${RUNNER_TEMP}/release-notes.md"
