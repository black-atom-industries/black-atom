glob_matcher: doublestar
assert_lefthook_installed: true

pre-commit:
    piped: true
    jobs:
        - name: format
          glob: "**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs,json,jsonc,md,markdown,css,scss,less,yml,yaml,toml,html}"
          run: npx oxfmt --check --no-error-on-unmatched-pattern {staged_files}
        - name: lint
          glob: "**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
          run: npx eslint --no-warn-ignored {staged_files}
        - name: rust-format
          glob: "**/*.rs"
          run: cargo fmt --check

pre-push:
    jobs:
        - name: workspace-verify
          run: npm run verify
        - name: livery-e2e
          glob:
              - "livery/**"
              - "core/src/**"
              - "adapters/*/themes/**"
          run: npm run test:e2e
